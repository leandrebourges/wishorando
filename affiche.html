
<!doctype html>
<html>
<head>
<title>Affichage de fichiers GPX sur une carte - Mercantour ... un blog</title>
<meta charset="UTF-8">
</head>
<body>
<p>test</p>
<!-- le plus important, le <div> où va s'afficher la carte -->
<div id="leaMap" style="max-width : 1024px"></div>

<!-- les blibliothèques à inclure, par des CDNs ou en local pour Leaflet -->
<link rel="stylesheet" href="leaflet.css"/>
<script src="leaflet.js"></script>
<script src="https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

<!-- on assemble tout ça -->
<script>
  // dans cet exemple, on va afficher juste du OSM
  var osmUrl='https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
  var osmAttrib='Map data © <a href="https://openstreetmap.org">OpenStreetMap</a> contributors';
  
  // création de la carte Leaflet
  var map = L.map('leaMap',{
      zoom: 9,
      center: [44.215697,7.372637],
  });		
  
  // on ajoute la carte OSM
  L.control.layers({
    'Cartes OSM': L.tileLayer(osmUrl,{attribution : osmAttrib}).addTo(map)
  }).addTo(map);
  
  // on appelle 4 lignes de PHP pour récupérer 
  // la liste des GPX dans un répertoire du serveur
	var zoomThisIndex=null;   // l'index de celui que l'on veut zoomer, ou null pour n'en zoomer aucun
  $.get("gpxmap.php", function(data) {
    // on parcours notre tableau JSON de GPX
    for (index=0;index<data.length; ++index) {
			var gpxLayer=new L.GPX(data[index], {async: true, doZoom: (index==zoomThisIndex)})
			.on('loaded', 
			  function(e) {
					if (e.sourceTarget.options.doZoom) 
						map.fitBounds(e.target.getBounds())
					this.bindTooltip(this.get_name());
				}
			).addTo(map);
			
			
			
      // et pour chaque, on crée une couche grâce à Omnivore qui relit le GPX
     var gpxLayer = omnivore.gpx(data[index]).addTo(map);
			 if (index==1) {
			  var gpxBounds=map.getBounds(gpxLayer);
				map.fitBounds(gpxBounds);
			} 
    }    
  });
	


</script>
  </body>
</html>
